service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: |
    SLO quy định trong chu kỳ 28 ngày, 99.5% request gửi đến hệ thống phải trả lời thành công
    với độ trễ latency <= 3000ms. Ngân sách lỗi (Error Budget) cho phép là 0.5%
    (tương đương tối đa 50 request bị chậm hoặc lỗi trên mỗi 10,000 request).
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
